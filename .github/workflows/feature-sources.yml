name: Feature source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check source, runtime files and generated documentation
        run: node tools/build-feature-sources.mjs --check
      - name: Test assembly and preservation guards
        run: node --test tests/feature-layout.test.cjs
