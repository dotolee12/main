<section id="gilo-dialogue-layer" aria-hidden="true" aria-live="polite">
  <div id="gilo-dialogue-box" role="dialog" aria-modal="false" aria-labelledby="gilo-dialogue-name" aria-describedby="gilo-dialogue-copy">
    <div class="gilo-dialogue-character-stage" aria-hidden="true">
      <img id="gilo-dialogue-character" alt="">
    </div>
    <button id="gilo-dialogue-close" type="button" aria-label="Close">&times;</button>
    <div class="gilo-dialogue-content">
      <div id="gilo-dialogue-name">Gilo</div>
      <p id="gilo-dialogue-copy"></p>
      <div class="gilo-dialogue-footer">
        <span id="gilo-dialogue-progress" aria-hidden="true"></span>
        <button id="gilo-dialogue-next" type="button" onclick="return nextGiloDialogue(event)"></button>
      </div>
    </div>
  </div>
</section>

<div id="hud" onclick="event.stopPropagation()">
<button id="hud-close" type="button" onclick="event.preventDefault(); event.stopPropagation(); if (isHudExpanded) toggleHud();" data-i18n-extra-aria="close" aria-label="닫기">&times;</button>
<div id="hud-handle" onclick="event.preventDefault(); event.stopPropagation(); toggleHud();" role="button" data-i18n-extra-aria="openHud" aria-label="HUD 열기">
<div id="hud-mini-avatar" class="my-gilo-avatar my-gilo-avatar-mini" aria-hidden="true"><div class="my-gilo-aura"></div><img class="my-gilo-character" src="./gilo%20many%20appearance/gilo-tutorial-welcome-transparent.png" alt=""><span class="my-gilo-equipped-item" hidden><img alt=""></span></div>
<div id="hud-mini-main"><div id="hud-mini-line">LV 1</div><div id="hud-mini-xp-track"><div class="hud-mini-xp-fill" id="hud-mini-progress"></div></div></div>
</div>
<div id="hud-basic">
<div class="hud-identity-sync-layout">
<section id="rpg-growth-panel" class="rpg-growth-panel" data-i18n-extra-aria="travelGrowth" aria-label="실시간 여행 성장">
<div class="rpg-growth-head"><div><div id="rpg-growth-kicker" class="rpg-growth-kicker">REAL-WORLD TRAVEL RPG</div><strong id="rpg-trait-name">Travel growth</strong></div><div class="rpg-level-badge">LV <b id="rpg-level">1</b><span id="rpg-level-max" hidden>MAX</span></div></div>
<div class="my-gilo-profile"><div id="rpg-my-gilo-title" class="my-gilo-title">나의 길로</div><div id="hud-main-gilo" class="my-gilo-avatar my-gilo-avatar-main" aria-hidden="true"><div class="my-gilo-aura"></div><img class="my-gilo-character" src="./gilo%20many%20appearance/gilo-tutorial-welcome-transparent.png" alt=""><span class="my-gilo-equipped-item" hidden><img alt=""></span></div></div>
<div id="rpg-trait-copy" class="rpg-trait-copy"></div>
<div id="rpg-today-summary" class="rpg-today-summary">
<button id="rpg-today-distance" type="button" onclick="event.stopPropagation(); openRpgJourneyView('distance');"></button>
<button id="rpg-today-visits" type="button" onclick="event.stopPropagation(); openRpgJourneyView('visits');"></button>
<button id="rpg-today-photos" type="button" onclick="event.stopPropagation(); openRpgJourneyView('photos');"></button>
<button id="rpg-today-missions" type="button" onclick="event.stopPropagation(); openRpgJourneyView('missions');"></button>
</div>
<button id="journey-recap-open" class="journey-recap-open" data-i18n-extra="recapOpen" type="button" onclick="event.stopPropagation(); showTodayJourneyRecap();">오늘의 대동여지도 보기</button>
<div class="rpg-next-row"><span id="rpg-next-label">다음 레벨까지</span><div class="rpg-next-track"><i id="rpg-level-progress"></i></div><b id="rpg-next-value">40</b></div>
<button id="rpg-details-toggle" class="rpg-details-toggle" type="button" aria-expanded="false" onclick="event.stopPropagation(); toggleRpgDetails();"></button>
<div id="rpg-stat-details" class="rpg-stat-details" hidden>
<div id="rpg-color-title" class="rpg-color-title">나의 여행색</div>
<div class="rpg-stat exploration"><div><span></span><b id="rpg-stat-exploration">0</b></div><i><em id="rpg-bar-exploration"></em></i></div>
<div class="rpg-stat experience"><div><span></span><b id="rpg-stat-experience">0</b></div><i><em id="rpg-bar-experience"></em></i></div>
<div class="rpg-stat memory"><div><span></span><b id="rpg-stat-memory">0</b></div><i><em id="rpg-bar-memory"></em></i></div>
<div class="rpg-stat connection"><div><span></span><b id="rpg-stat-connection">0</b></div><i><em id="rpg-bar-connection"></em></i></div>
<div class="rpg-stat growth"><div><span></span><b id="rpg-stat-growth">0</b></div><i><em id="rpg-bar-growth"></em></i></div>
</div>
</section>
  <section class="cloud-account-card" aria-labelledby="cloud-account-title">
    <h2 id="cloud-account-title">기록 동기화</h2>
    <p id="cloud-account-copy">로그인하면 이 기기의 기록을 먼저 보존한 뒤 길로아 서버와 동기화합니다.</p>
    <div id="cloud-account-signed-out">
      <input id="cloud-email" class="cloud-account-input" type="email" inputmode="email" autocomplete="email" placeholder="이메일">
      <input id="cloud-password" class="cloud-account-input" type="password" autocomplete="current-password" minlength="6" placeholder="비밀번호 (6자 이상)">
      <div class="cloud-account-actions">
        <button id="cloud-sign-in" type="button" onclick="GiloaCloud.signInFromForm()">로그인</button>
        <button id="cloud-sign-up" type="button" class="secondary" onclick="GiloaCloud.signUpFromForm()">가입</button>
      </div>
      <button id="cloud-reset-request" type="button" class="cloud-account-text-button" onclick="GiloaCloud.requestPasswordReset()">비밀번호 재설정</button>
    </div>
    <div id="cloud-account-recovery" hidden>
      <input id="cloud-new-password" class="cloud-account-input" type="password" autocomplete="new-password" minlength="6" placeholder="새 비밀번호 (6자 이상)">
      <input id="cloud-new-password-confirm" class="cloud-account-input" type="password" autocomplete="new-password" minlength="6" placeholder="새 비밀번호 확인">
      <div class="cloud-account-actions">
        <button id="cloud-password-update" type="button" onclick="GiloaCloud.updatePassword()">비밀번호 변경</button>
        <button id="cloud-password-cancel" type="button" class="secondary" onclick="GiloaCloud.cancelPasswordReset()">취소</button>
      </div>
    </div>
    <div id="cloud-account-signed-in" hidden>
      <strong id="cloud-account-email"></strong>
      <div class="cloud-account-actions">
        <button id="cloud-sync-now" type="button" onclick="GiloaCloud.syncNow(true)">지금 동기화</button>
        <button id="cloud-sign-out" type="button" class="secondary" onclick="GiloaCloud.signOut()">로그아웃</button>
      </div>
    </div>
    <p id="cloud-account-status" class="cloud-account-status" aria-live="polite"></p>
  </section>
</div>
</div>
</div>

<section id="journey-recap" class="journey-recap" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="journey-recap-title">
<div class="journey-recap-scrim" onclick="hideTodayJourneyRecap()"></div>
<div class="journey-recap-card">
<button class="journey-recap-close" type="button" onclick="hideTodayJourneyRecap()" data-i18n-extra-aria="close" aria-label="닫기">&times;</button>
<div class="journey-recap-visual"><img id="journey-recap-gilo" src="" data-i18n-extra-alt="gilo" alt="길로"><div><span data-i18n-extra="recapKicker">오늘의 대동여지도</span><h2 id="journey-recap-title" data-i18n-extra="recapTitle">오늘 하나의 여행을 완성했어요</h2><p id="journey-recap-date"></p></div></div>
<div class="journey-recap-stats">
<div><b id="journey-recap-distance">0.0 km</b><span data-i18n-extra="recapDistance">걸은 거리</span></div><div><b id="journey-recap-visits">0</b><span data-i18n-extra="recapDiscoveries">새로운 발견</span></div><div><b id="journey-recap-photos">0</b><span data-i18n-extra="recapPhotos">사진</span></div><div><b id="journey-recap-memories">0</b><span data-i18n-extra="recapMemories">기억</span></div>
</div>
<div class="journey-recap-growth"><span data-i18n-extra="recapGrowth">오늘 가장 많이 자란 여행색</span><strong id="journey-recap-trait">탐험 +0</strong><p id="journey-recap-message">오늘의 발걸음이 나만의 지도가 되었어요.</p></div>
<div class="journey-recap-actions"><button type="button" data-i18n-extra="recapRoute" onclick="openTodayRouteFromRecap()">오늘 걸은 길 전체 보기</button><button type="button" class="secondary" data-i18n-extra="close" onclick="hideTodayJourneyRecap()">닫기</button></div>
</div>
</section>
