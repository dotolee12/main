<div id="map-wrap">
<div id="map"></div>
<canvas id="durunubi-canvas" aria-hidden="true"></canvas>
<div id="durunubi-loaded-badge" class="durunubi-loaded-badge" hidden></div>
<canvas id="color-reveal-canvas" aria-hidden="true"></canvas>
<canvas id="fog-canvas"></canvas>
<canvas id="fog-shade-canvas" aria-hidden="true"></canvas>
<canvas id="age-canvas"></canvas>
<canvas id="stay-canvas"></canvas>
<div id="time-atmosphere" aria-hidden="true"></div>
</div>

<section id="hidden-mission-novel" class="hidden-mission-novel" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="hidden-mission-title">
  <button id="hidden-mission-close" class="hidden-mission-close" type="button" aria-label="Close">×</button>
  <div class="hidden-mission-scrim"></div>
  <div class="hidden-mission-stage">
    <div class="hidden-mission-glow" aria-hidden="true"></div>
    <img id="hidden-mission-gilo" class="hidden-mission-gilo" src="" alt="">
    <div class="hidden-mission-dialogue">
      <div id="hidden-mission-kicker" class="hidden-mission-kicker">HIDDEN MISSION CLEAR</div>
      <h2 id="hidden-mission-title"></h2>
      <p id="hidden-mission-copy"></p>
      <div id="hidden-mission-rewards" class="hidden-mission-rewards" hidden></div>
      <div class="hidden-mission-progress" aria-hidden="true"><i id="hidden-mission-progress"></i></div>
      <button id="hidden-mission-next" class="hidden-mission-next" type="button"></button>
    </div>
  </div>
</section>

<div id="gilo-tour-loading" aria-hidden="true" aria-live="polite">
  <div id="gilo-loading-message" class="gilo-loading-message">길로가 주변 정보를 모으고 있어요</div>
</div>

<div id="kakao-traffic-wrap" aria-hidden="true">
<div id="kakao-traffic-map"></div>
<button id="kakao-traffic-close" data-i18n-extra="close" type="button" onclick="toggleKakaoTraffic(false)">닫기</button>
</div>

<div id="top-bar">
<div id="top-left-actions">
<div id="ham-btn" onclick="toggleSidebar()" role="button" tabindex="0" data-i18n-extra-aria="openMenu" aria-label="메뉴 열기"><div class="hline"></div><div class="hline"></div><div class="hline"></div></div>
<div id="rec-status-box" role="status">대기 중</div>
</div>
<button id="adventure-music-toggle" type="button" aria-label="길로의 모험 재생" title="길로의 모험 재생" aria-pressed="false" aria-controls="adventure-music-audio">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="17" rx="3" ry="2.5"/><ellipse cx="17" cy="15" rx="3" ry="2.5"/><path class="music-off-slash" d="M3 3l18 18"/></svg>
</button>
<span id="adventure-music-status" class="music-screen-reader" role="status" aria-live="polite"></span>

<div id="daily-task-widget">
  <button id="place-search-button" type="button" aria-label="장소 검색" title="장소 검색" aria-expanded="false" aria-controls="local-shops-panel" onclick="window.GiloaPlaceSearch ? window.GiloaPlaceSearch.open() : window.giloaRetryPlaceModule()"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></button>
  <button id="daily-task-tag" type="button" onclick="toggleDailyTasks()" aria-expanded="false" aria-controls="daily-task-panel">
    <span id="daily-task-tag-label" class="daily-task-tag-label">할 일</span>
    <span id="daily-task-tag-count">0/3</span>
  </button>
  <section id="daily-task-panel" aria-hidden="true" aria-labelledby="daily-task-title">
    <div class="daily-task-head">
      <div>
        <div id="daily-task-kicker" class="daily-task-kicker">오늘의 길로아</div>
        <h2 id="daily-task-title">오늘의 할 일</h2>
      </div>
      <button class="daily-task-close" type="button" onclick="toggleDailyTasks(false)" aria-label="할 일 닫기">&times;</button>
    </div>
    <p id="daily-task-copy" class="daily-task-copy">가볍게 걸으며 오늘의 길을 남겨보세요.</p>
    <div id="daily-task-list"></div>
    <div class="daily-task-summary"><span id="daily-task-summary">0/3 완료</span><span id="daily-task-reset">매일 자정에 새로 시작</span></div>
  </section>
</div>
</div>

<div id="tour-panel" class="collapsed">
  <div id="tour-header" role="button" tabindex="0" aria-controls="tour-list" aria-expanded="false">
    <span id="tour-title">주변 관광지</span>
    <div id="tour-header-right">
      <span id="tour-count"></span>
      <span id="tour-festival-badge"></span>
      <span id="tour-toggle-icon" aria-hidden="true">⌄</span>
      <button id="tour-close-btn" onclick="closeTourPanel(event)" aria-label="닫기">&times;</button>
    </div>
  </div>
  <div id="festival-strip-label">주변 축제</div>
  <div id="festival-strip"></div>
  <div id="tour-list"></div>
  <div id="tour-source-credit" data-i18n-extra="sourceTourismCredit">출처: ⓒ한국관광공사</div>
  <div id="tour-expand-btn" onclick="toggleTourMore(event)"><span id="tour-expand-icon">▼</span> <span id="tour-expand-text">더보기</span></div>
  <div id="tour-loading" style="display:none;">검색 중...</div>
  <div id="tour-empty" style="display:none;">이 지역에 관광지가 없어요</div>
  <div id="discovery-toast" class="discovery-toast" aria-hidden="true" aria-live="polite">
    <div class="discovery-ring"></div>
    <img id="discovery-gilo" alt="" hidden>
    <div class="discovery-content"><div class="discovery-kicker">새로운 장소 발견</div><div id="discovery-place-name" class="discovery-place-name"></div><div id="discovery-method" class="discovery-method"></div><div id="discovery-reward" class="discovery-reward"></div></div>
  </div>
</div>

<div id="controls">
<div id="photo-btn" class="btn" onclick="togglePhotoMenu()" title="사진 촬영 및 추가" aria-label="사진 촬영 및 추가"><svg class="camera-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7.5h3.3L9 5h6l1.7 2.5H20a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18V9A1.5 1.5 0 0 1 4 7.5Z"/><circle cx="12" cy="13.2" r="3.7"/><path d="M5.6 10.3h1.6M18 10.2h.01"/></svg></div>
<div id="traffic-btn" class="btn" onclick="openKakaoDirections()" title="카카오맵 길찾기" aria-label="카카오맵 길찾기"><svg class="route-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5V5M12 9.5V12M12 16.5V21M8.5 21h7"/><path d="M12 5h6.5l2.2 2.25-2.2 2.25H12Z"/><path d="M12 12H5.5l-2.2 2.25 2.2 2.25H12Z"/></svg></div>
<div id="rec-btn" class="btn record-loc-btn" onclick="toggleLocationRecording()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}" role="button" tabindex="0" title="현재 위치 확인 및 기록 시작 또는 중단" aria-label="현재 위치 확인 및 GPS 경로 기록 시작 또는 중단"><span class="loc-crosshair" aria-hidden="true"><span class="loc-record-icon"></span></span></div>
</div>
