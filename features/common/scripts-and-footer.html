<script id="giloa-place-module-recovery">
(function () {
    var pending = {}, retried = {};
    var modules = { shops:['./local-shops.js?v=11',function(){return !!window.GiloaPlaceSearch;}], medical:['./medical-layers.js?v=map-order-3',function(){return !!window.GiloaMedicalLayers;}], community:['./community-places.js?v=1',function(){return !!window.GiloaCommunityPlaces;}] };
    function recover(key, manual) {
        var spec = modules[key];
        if (spec[1]()) { if (manual && key === 'shops') window.GiloaPlaceSearch.open(); return; }
        if (pending[key] || (!manual && retried[key])) return;
        retried[key] = true; pending[key] = true;
        var script = document.createElement('script');
        script.src = spec[0] + '&recovery=1';
        function done() { pending[key] = false; script.remove(); }
        script.onload = function() { done(); if (manual && window.GiloaPlaceSearch) window.GiloaPlaceSearch.open(); };
        script.onerror = function() { done(); if (manual) { var button=document.getElementById('place-search-button'); if(button) button.title = document.documentElement.lang === 'ko' ? '연결 후 검색 버튼을 다시 눌러 주세요.' : 'Reconnect and press search again.'; } };
        document.head.appendChild(script);
    }
    window.giloaRetryPlaceModule = function() { recover('shops',true); };
    document.addEventListener('DOMContentLoaded',function(){ recover('shops',false); recover('medical',false); recover('community',false); });
    window.addEventListener('online',function(){ retried = {}; recover('shops',false); recover('medical',false); recover('community',false); });
}());
</script>

<script>
(function () {
  var button = document.getElementById("gilo-welcome-play");
  var audio = document.getElementById("gilo-welcome-audio");
  var status = document.getElementById("gilo-welcome-status");
  if (!button || !audio) return;
  var words = {
    ko: ["🔊 길로의 인사 듣기", "■ 인사 정지", "Suno로 만든 한국어 환영 음성", "음성을 불러오지 못했어요. 다시 눌러 주세요."],
    en: ["🔊 Hear Gilo's greeting", "■ Stop greeting", "Korean welcome audio created with Suno", "Audio could not play. Please try again."],
    ja: ["🔊 ギロの挨拶を聞く", "■ 停止", "Sunoで制作した韓国語の歓迎音声", "再生できませんでした。もう一度お試しください。"],
    zh: ["🔊 听听Gilo的问候", "■ 停止播放", "使用Suno制作的韩语欢迎语音", "无法播放，请重试。"],
    es: ["🔊 Escuchar a Gilo", "■ Detener", "Bienvenida en coreano creada con Suno", "No se pudo reproducir. Inténtalo de nuevo."],
    fr: ["🔊 Écouter Gilo", "■ Arrêter", "Accueil en coréen créé avec Suno", "Lecture impossible. Veuillez réessayer."]
  };
  var failed = false, pending = false, request = 0;
  function copy() {
    var lang = typeof currentLang === "string" ? currentLang : document.documentElement.lang || "ko";
    return words[lang.slice(0, 2)] || words.en;
  }
  function render() {
    var w = copy(), playing = !audio.paused;
    button.textContent = w[playing ? 1 : 0];
    button.setAttribute("aria-pressed", String(playing));
    button.disabled = pending;
    status.textContent = w[failed ? 3 : 2];
  }
  function stop() {
    request++; pending = false;
    audio.pause(); audio.currentTime = 0; render();
  }
  button.addEventListener("click", function () {
    if (!audio.paused) { stop(); return; }
    failed = false; pending = true;
    var id = ++request; render();
    audio.play().then(function () {
      if (id !== request) return;
      pending = false; render();
    }).catch(function () {
      if (id !== request) return;
      pending = false; failed = true; render();
    });
  });
  ["play", "pause", "ended"].forEach(function (event) { audio.addEventListener(event, render); });
  audio.addEventListener("error", function () { pending = false; failed = true; render(); });
  var start = document.getElementById("gsi-start");
  if (start) start.addEventListener("click", stop);
  window.addEventListener("pagehide", stop);
  document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); });
  new MutationObserver(render).observe(document.getElementById("gsi-start-copy"), {childList:true, subtree:true, characterData:true});
  render();
})();
</script>
