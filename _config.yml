# Keep offline-only and build inputs in Git, outside the hosted Pages artifact.
# The hosted trail layer uses durunubi-routes.json; file:// uses the JS copy.
# The hosted parking layer uses data/parking/ bundles and tiles.
exclude:
  - android-app
  - tests
  - tools
  # A literal .js exclusion also matches the .json prefix in Jekyll.
  - "data/durunubi-routes.[j]s"
  - "app/data/durunubi-routes.[j]s"
  - data/전국주차장정보표준데이터.csv
  - data/전국주차장정보표준데이터.json
  - app/data/전국주차장정보표준데이터.csv
  - app/data/전국주차장정보표준데이터.json
  # The /app/ web copy reads these identical datasets from the site root.
  - app/data/durunubi-routes.json
  - app/data/medical/bundle.js
  - app/data/parking/bundle.js
